<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages | LifeTop</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap"><link rel="icon" href="icons/icon-192.png"><link rel="stylesheet" href="css/style.css?v=13.0.1"><link rel="stylesheet" href="css/mini-apps.css?v=1"><link rel="stylesheet" href="css/35-unified-ui.css?v=14.0.0"><link rel="stylesheet" href="css/pasidea-components.css?v=14.0.3"><link rel="stylesheet" href="css/lifetop-layout.css?v=14.0.0"><link rel="stylesheet" href="css/messages-ui.css?v=14.0.0"><script>try{const c=JSON.parse(localStorage.getItem('lifetop_v1_0_data')||'{}');document.documentElement.dataset.theme=c?.colorMode==='light'?'light':'dark';}catch{}</script></head>
<body class="ui-system ui-scope mini-page messages-page"><main class="messages-shell">
<header class="messages-header"><h1>Messages</h1><div class="messages-header-actions"><a class="text-btn messages-home" href="index.html">ホーム</a><span id="messages-account"></span><button type="button" class="text-btn" id="messages-logout" hidden>ログアウト</button></div></header>
<p id="messages-status" class="pasidea-notice" role="status" aria-live="polite"></p>
<section id="messages-login" class="messages-login"><button type="button" id="messages-connect" class="primary-btn" disabled>Googleでログイン</button><button type="button" id="messages-retry" class="text-btn" hidden>再試行</button></section>
<section id="messages-controls" class="messages-content" hidden>
 <nav class="messages-sidebar" aria-label="ルーム"><div class="messages-room-header"><h2>ルーム</h2><button type="button" id="messages-refresh" class="text-btn">更新</button></div><button type="button" id="messages-join" class="primary-btn" hidden>招待から参加</button><div id="messages-rooms"></div><details><summary>ルームを作成</summary><form id="messages-create-form" class="mini-tools"><label>ルーム名<input id="messages-name" maxlength="80" required></label><button type="submit" id="messages-create" class="primary-btn">作成</button></form></details></nav>
 <section id="messages-room" aria-label="会話" hidden><header class="messages-room-header"><div><h2 id="messages-room-title"></h2><span id="messages-members"></span></div><details><summary>ルームの操作</summary><div class="messages-room-actions"><button type="button" id="messages-rotate" class="text-btn" hidden>招待リンク</button><button type="button" id="messages-leave" class="text-btn">退出</button><button type="button" id="messages-delete-room" class="text-btn" hidden>削除</button></div></details></header><p id="messages-invite"></p><ol id="messages-history" aria-label="メッセージ履歴" aria-live="polite" aria-relevant="additions"></ol><form id="messages-send"><label for="messages-body">メッセージ<textarea id="messages-body" maxlength="2000" rows="2" required></textarea></label><button type="submit" class="primary-btn">送信</button></form></section>
</section><footer class="messages-footer">LifeTop v14.0</footer></main><script type="module" src="js/messages.js?v=14.0.0"></script></body></html>
