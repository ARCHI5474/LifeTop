<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages | LifeTop</title><link rel="icon" href="icons/icon-192.png"><link rel="stylesheet" href="css/style.css?v=9.0"><link rel="stylesheet" href="css/mini-apps.css?v=1"></head>
<body class="mini-page"><header class="mini-header"><a class="mini-brand" href="index.html">LifeTop <span>MESSAGES</span></a><a class="text-btn" href="index.html">ホームへ</a></header><main class="mini-main"><h1>LifeTop Messages</h1><p>Googleログイン不要。匿名IDで招待ルームに参加します。ブラウザのデータを消すと、以前のID・ルーム・管理権限を復元できません。</p><p id="messages-status" role="status" aria-live="polite"></p><div id="messages-setup" hidden><p>現在は未有効です。管理者による匿名認証・App Check・サーバー・Security Rules・履歴削除の設定が必要です。外部サービスの有料設定は変更していません。</p><a href="CONNECTED_CANVAS_RELEASE.md">設定と制約</a></div><section id="messages-controls" hidden><div class="mini-tools"><label>ニックネーム<input id="messages-nickname" maxlength="40" required></label><button id="messages-connect" class="primary-btn">匿名IDで接続</button><button id="messages-notifications" class="tonal-btn">通知を許可</button></div><div id="messages-signed-in" hidden><div class="mini-tools"><label>新しいルーム名<input id="messages-name" maxlength="80"></label><button id="messages-create" class="primary-btn">ルーム作成</button><button id="messages-refresh" class="tonal-btn">参加ルーム更新</button><button id="messages-join" class="tonal-btn" hidden>招待から参加</button></div><p id="messages-invite" style="overflow-wrap:anywhere"></p><h2>参加中ルーム</h2><div id="messages-rooms" class="mini-tools"></div><section id="messages-room" hidden><h2 id="messages-room-title"></h2><p id="messages-members"></p><div class="mini-tools"><button id="messages-leave" class="tonal-btn">退出</button><button id="messages-rotate" class="tonal-btn" hidden>招待を無効化・再発行</button><button id="messages-delete-room" class="tonal-btn" hidden>ルーム削除</button></div><p>履歴は90日間、直近100件を表示。通知はこのページを開いている間のみです。</p><ol id="messages-history" class="mini-results" aria-live="polite"></ol><form id="messages-send"><label>メッセージ<textarea id="messages-body" maxlength="2000" required></textarea></label><button class="primary-btn">送信</button></form></section></div></section></main><script type="module" src="js/messages.js"></script></body></html>
