<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ミニアプリ | LifeTop</title><link rel="icon" href="icons/icon-192.png"><link rel="stylesheet" href="css/style.css?v=9.0"><link rel="stylesheet" href="css/mini-apps.css?v=1"><link rel="stylesheet" href="css/festival.css?v=10.0"></head>
<body class="mini-page">
<header class="mini-header"><a href="index.html" class="mini-brand"><img src="icons/icon-192.png" width="34" height="34" alt="">LifeTop <span>STUDIO</span></a><a class="text-btn" href="index.html">ホームに戻る</a></header>
<main class="mini-main">
<section id="mini-home"><p class="mini-kicker">MAKE SOMETHING YOURS</p><h1>ひらめきを、提出できる形に。</h1><p class="mini-intro">文書も、グラフも、動画も。登録なしで使える14の小さな道具。ファイルはこの端末の中で処理します。</p><label class="mini-filter-label">アプリを探す<input id="mini-filter" type="search" placeholder="動画、PDF、レポート…"></label><div id="mini-catalog" class="mini-catalog"></div><p id="mini-no-results" hidden>該当するアプリがありません。</p></section>
<section id="mini-workspace" hidden aria-labelledby="mini-title">
<div class="mini-workspace-header"><div><p class="mini-kicker">YOUR WORKSPACE</p><h1 id="mini-title"></h1><p id="mini-description"></p></div><button type="button" class="tonal-btn" id="mini-home-button">アプリ一覧</button></div>
<div class="mini-project-bar"><label>アプリ<select id="mini-picker"></select></label><label>作品名<input id="mini-name" maxlength="80" value="無題"></label><button type="button" class="tonal-btn" id="mini-project-save">作業ファイルを保存</button><label class="tonal-btn mini-file-label">作業ファイルを開く<input id="mini-project-open" type="file" accept=".json,application/json" hidden></label></div>
<p class="mini-storage-note">各アプリの直近の作業を端末に自動保存。別の端末へ移す前は「作業ファイルを保存」。動画・音声・元画像は含まれないため、再開時に選び直してください。文書・スライドは独自形式です。</p>
<div id="mini-content" class="mini-content"></div>
</section>
<p id="mini-status" class="mini-status" role="status" aria-live="polite">使いたいアプリを選んでください。</p>
</main><script type="module" src="js/mini-apps.js?v=1"></script></body></html>
